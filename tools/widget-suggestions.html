<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Suggestions – Dolphin Education</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #0b1622;
  --surface:  #0f2032;
  --surface2: #142b41;
  --surface3: #1c3b57;
  --border:   #24506f;
  --accent:   #22c1e3;
  --text:     #eaf6fb;
  --muted:    #8fbcd4;
  --green:    #22d3a5;
  --red:      #f85a5a;
  --gold:     #f5b942;
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }

#jmg-suggestions {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-height: 500px;
  background: var(--bg);
}

.sg-header {
  padding: 16px 22px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.sg-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sg-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

.sg-tabs {
  display: flex;
  gap: 4px;
  padding: 10px 22px 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sg-tab {
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  user-select: none;
}
.sg-tab.active { color: var(--text); border-bottom-color: var(--accent); }
.sg-tab .count {
  display: inline-block;
  margin-left: 6px;
  background: var(--red);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  border-radius: 10px;
  padding: 1px 6px;
}

.sg-body { flex: 1; overflow-y: auto; padding: 20px 22px; }
.sg-panel { display: none; max-width: 620px; margin: 0 auto; }
.sg-panel.active { display: block; }

.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.field .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
.field select, .field textarea, .field input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  resize: vertical;
}
.field select:focus, .field textarea:focus, .field input:focus { border-color: var(--accent); }
.field textarea { min-height: 90px; }
.optional-tag { color: var(--muted); font-weight: 400; font-size: 11px; }

.btn {
  padding: 10px 20px;
  border-radius: 8px;
  border: none;
  background: var(--accent);
  color: #062430;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
}
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.secondary { background: var(--surface3); color: var(--text); }
.btn.danger { background: var(--red); color: #fff; }
.btn.success { background: var(--green); color: #062430; }
.btn.sm { padding: 7px 14px; font-size: 12px; }

.sg-msg { font-size: 12px; margin-top: 10px; min-height: 14px; }
.sg-msg.error { color: var(--red); }
.sg-msg.success { color: var(--green); }

.sg-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 12px;
}
.sg-card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.sg-type {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 6px;
  background: var(--surface3);
  color: var(--accent);
}
.sg-meta { font-size: 11px; color: var(--muted); }
.sg-text { font-size: 14px; line-height: 1.5; margin-bottom: 6px; white-space: pre-wrap; word-break: break-word; }
.sg-reason { font-size: 12px; color: var(--muted); line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.sg-actions { display: flex; gap: 8px; margin-top: 12px; }
.sg-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 0; }
.sg-status-pill {
  font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 10px;
}
.sg-status-pill.approved { background: rgba(34,211,165,0.15); color: var(--green); }
.sg-status-pill.denied   { background: rgba(248,90,90,0.15); color: var(--red); }

.admin-box {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.admin-box h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 10px; }
.admin-row { display: flex; gap: 8px; margin-bottom: 8px; }
.admin-row input { flex: 1; }
.mod-list-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; margin-bottom: 6px; font-size: 13px;
}
.role-pill { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 8px; }
.role-pill.mod   { background: rgba(34,211,165,0.15); color: var(--green); }
.role-pill.owner { background: rgba(245,185,66,0.15); color: var(--gold); }

.locked {
  max-width: 420px; margin: 60px auto; text-align: center; color: var(--muted); font-size: 14px;
}
</style>
</head>
<body>

<div id="jmg-suggestions">
  <div class="sg-header">
    <div class="sg-title">🐬 Suggestions</div>
    <div class="sg-sub">Share ideas, report issues, and help shape Dolphin Education.</div>
  </div>

  <div class="sg-tabs" id="sgTabs">
    <div class="sg-tab active" data-tab="submit" onclick="switchTab('submit')">Submit</div>
    <div class="sg-tab" data-tab="mine" onclick="switchTab('mine')">My Suggestions</div>
    <div class="sg-tab" id="tabReviewBtn" data-tab="review" style="display:none;" onclick="switchTab('review')">
      Review<span class="count" id="reviewCount" style="display:none;">0</span>
    </div>
    <div class="sg-tab" id="tabApprovedBtn" data-tab="approved" style="display:none;" onclick="switchTab('approved')">
      Approved<span class="count" id="approvedCount" style="display:none;">0</span>
    </div>
  </div>

  <div class="sg-body">

    <!-- SUBMIT -->
    <div class="sg-panel active" id="panel-submit">
      <div id="submitLocked" style="display:none;" class="locked">
        Log in to submit a suggestion.
      </div>
      <div id="submitForm">
        <div class="field">
          <label>What type of suggestion are you making?</label>
          <select id="sgType">
            <option value="Game Suggestion">Game Suggestion</option>
            <option value="Website Feature">Website Feature</option>
            <option value="Issue">Issue</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field">
          <label>What are you suggesting?</label>
          <textarea id="sgSuggestion" maxlength="2000" placeholder="Describe your suggestion..."></textarea>
        </div>
        <div class="field">
          <label>Why are you making this suggestion? <span class="optional-tag">(optional)</span></label>
          <textarea id="sgReason" maxlength="2000" placeholder="Any extra context..."></textarea>
        </div>
        <button class="btn" id="sgSubmitBtn" onclick="submitSuggestion()">Submit Suggestion</button>
        <div class="sg-msg" id="sgSubmitMsg"></div>
      </div>
    </div>

    <!-- MY SUGGESTIONS -->
    <div class="sg-panel" id="panel-mine">
      <div id="mineList"></div>
    </div>

    <!-- MOD REVIEW (pending) -->
    <div class="sg-panel" id="panel-review">
      <div id="reviewList"></div>
    </div>

    <!-- OWNER APPROVED -->
    <div class="sg-panel" id="panel-approved">
      <div id="approvedList"></div>

      <div class="admin-box" id="adminBox" style="display:none;">
        <h3>Admin — Moderators</h3>
        <div class="admin-row">
          <input type="text" id="promoteUsername" placeholder="Username to promote to mod">
          <button class="btn sm" onclick="promoteUser()">Make Mod</button>
        </div>
        <div class="sg-msg" id="adminMsg"></div>
        <div id="modList" style="margin-top:12px;"></div>
      </div>
    </div>

  </div>
</div>

<script>
  const BACKEND = 'https://justmathgames-backend.onrender.com';
  let token = localStorage.getItem('jmg_token') || null;
  let me    = localStorage.getItem('jmg_username') || null;
  let myRole = 'user';

  function $(id) { return document.getElementById(id); }
  function authHeaders() { return token ? { Authorization: `Bearer ${token}` } : {}; }
  function escHtml(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function timeAgo(dateStr) {
    const diff = Math.max(0, Date.now() - new Date(dateStr).getTime());
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
  }

  function switchTab(tab) {
    document.querySelectorAll('.sg-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
    document.querySelectorAll('.sg-panel').forEach(el => el.classList.toggle('active', el.id === `panel-${tab}`));
    if (tab === 'mine') loadMine();
    if (tab === 'review') loadReview();
    if (tab === 'approved') loadApproved();
  }

  async function loadRole() {
    if (!token || !me) { myRole = 'user'; return; }
    try {
      const res = await fetch(`${BACKEND}/profile/${encodeURIComponent(me)}`, { headers: authHeaders() });
      if (res.ok) {
        const data = await res.json();
        myRole = data.role || 'user';
      }
    } catch {}
  }

  function applyRoleUi() {
    const isMod = myRole === 'mod' || myRole === 'owner';
    const isOwner = myRole === 'owner';
    $('tabReviewBtn').style.display = isMod ? '' : 'none';
    $('tabApprovedBtn').style.display = isOwner ? '' : 'none';
    $('adminBox').style.display = isOwner ? '' : 'none';

    if (!token || !me) {
      $('submitLocked').style.display = 'block';
      $('submitForm').style.display = 'none';
    } else {
      $('submitLocked').style.display = 'none';
      $('submitForm').style.display = 'block';
    }

    if (isMod) refreshReviewCount();
    if (isOwner) refreshApprovedCount();
  }

  // ---------------- SUBMIT ----------------
  async function submitSuggestion() {
    const type = $('sgType').value;
    const suggestion = $('sgSuggestion').value.trim();
    const reason = $('sgReason').value.trim();
    const msg = $('sgSubmitMsg');
    msg.className = 'sg-msg';
    msg.textContent = '';

    if (!suggestion) {
      msg.className = 'sg-msg error';
      msg.textContent = 'Please describe your suggestion.';
      return;
    }

    $('sgSubmitBtn').disabled = true;
    try {
      const res = await fetch(`${BACKEND}/suggestions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ type, suggestion, reason })
      });
      const data = await res.json();
      if (!res.ok) {
        msg.className = 'sg-msg error';
        msg.textContent = data.error || 'Something went wrong.';
        return;
      }
      msg.className = 'sg-msg success';
      msg.textContent = 'Thanks! Your suggestion was submitted.';
      $('sgSuggestion').value = '';
      $('sgReason').value = '';
      if (myRole === 'mod' || myRole === 'owner') refreshReviewCount();
    } catch {
      msg.className = 'sg-msg error';
      msg.textContent = 'Could not reach the server.';
    } finally {
      $('sgSubmitBtn').disabled = false;
    }
  }

  // ---------------- MY SUGGESTIONS ----------------
  async function loadMine() {
    const container = $('mineList');
    if (!token) { container.innerHTML = '<div class="sg-empty">Log in to see your suggestions.</div>'; return; }
    container.innerHTML = '<div class="sg-empty">Loading...</div>';
    try {
      const res = await fetch(`${BACKEND}/suggestions/mine`, { headers: authHeaders() });
      const list = await res.json();
      if (!res.ok || !Array.isArray(list)) { container.innerHTML = '<div class="sg-empty">Could not load.</div>'; return; }
      if (!list.length) { container.innerHTML = '<div class="sg-empty">You haven\'t submitted anything yet.</div>'; return; }
      container.innerHTML = list.map(item => `
        <div class="sg-card">
          <div class="sg-card-top">
            <span class="sg-type">${escHtml(item.type)}</span>
            ${statusPill(item.status)}
          </div>
          <div class="sg-text">${escHtml(item.suggestion)}</div>
          ${item.reason ? `<div class="sg-reason">Why: ${escHtml(item.reason)}</div>` : ''}
          <div class="sg-meta" style="margin-top:8px;">Submitted ${timeAgo(item.createdAt)}</div>
        </div>
      `).join('');
    } catch {
      container.innerHTML = '<div class="sg-empty">Could not load.</div>';
    }
  }

  function statusPill(status) {
    if (status === 'pending') return `<span class="sg-status-pill" style="background:rgba(143,188,212,0.15);color:var(--muted);">Pending</span>`;
    if (status === 'approved') return `<span class="sg-status-pill approved">Approved</span>`;
    if (status === 'denied') return `<span class="sg-status-pill denied">Denied</span>`;
    if (status === 'completed') return `<span class="sg-status-pill approved">Completed</span>`;
    return '';
  }

  // ---------------- MOD REVIEW ----------------
  async function loadReview() {
    const container = $('reviewList');
    container.innerHTML = '<div class="sg-empty">Loading...</div>';
    try {
      const res = await fetch(`${BACKEND}/suggestions/pending`, { headers: authHeaders() });
      const list = await res.json();
      if (!res.ok || !Array.isArray(list)) { container.innerHTML = '<div class="sg-empty">Could not load.</div>'; return; }
      $('reviewCount').style.display = list.length ? '' : 'none';
      $('reviewCount').textContent = list.length;
      if (!list.length) { container.innerHTML = '<div class="sg-empty">No pending suggestions. All caught up!</div>'; return; }
      container.innerHTML = list.map(item => `
        <div class="sg-card" id="review-${item._id}">
          <div class="sg-card-top">
            <span class="sg-type">${escHtml(item.type)}</span>
            <span class="sg-meta">${escHtml(item.username)} · ${timeAgo(item.createdAt)}</span>
          </div>
          <div class="sg-text">${escHtml(item.suggestion)}</div>
          ${item.reason ? `<div class="sg-reason">Why: ${escHtml(item.reason)}</div>` : ''}
          <div class="sg-actions">
            <button class="btn sm success" onclick="reviewSuggestion('${item._id}','accept')">Accept</button>
            <button class="btn sm danger" onclick="reviewSuggestion('${item._id}','deny')">Deny</button>
          </div>
        </div>
      `).join('');
    } catch {
      container.innerHTML = '<div class="sg-empty">Could not load.</div>';
    }
  }

  async function refreshReviewCount() {
    try {
      const res = await fetch(`${BACKEND}/suggestions/pending`, { headers: authHeaders() });
      const list = await res.json();
      if (res.ok && Array.isArray(list)) {
        $('reviewCount').style.display = list.length ? '' : 'none';
        $('reviewCount').textContent = list.length;
      }
    } catch {}
  }

  async function reviewSuggestion(id, decision) {
    try {
      const res = await fetch(`${BACKEND}/suggestions/${id}/review`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ decision })
      });
      if (!res.ok) return;
      const card = $(`review-${id}`);
      if (card) card.remove();
      refreshReviewCount();
      if (myRole === 'owner') refreshApprovedCount();
    } catch {}
  }

  // ---------------- OWNER APPROVED ----------------
  async function loadApproved() {
    const container = $('approvedList');
    container.innerHTML = '<div class="sg-empty">Loading...</div>';
    try {
      const res = await fetch(`${BACKEND}/suggestions/approved`, { headers: authHeaders() });
      const list = await res.json();
      if (!res.ok || !Array.isArray(list)) { container.innerHTML = '<div class="sg-empty">Could not load.</div>'; return; }
      $('approvedCount').style.display = list.length ? '' : 'none';
      $('approvedCount').textContent = list.length;
      container.innerHTML = list.length
        ? list.map(item => `
          <div class="sg-card" id="approved-${item._id}">
            <div class="sg-card-top">
              <span class="sg-type">${escHtml(item.type)}</span>
              <span class="sg-meta">${escHtml(item.username)} · approved by ${escHtml(item.reviewedBy)}</span>
            </div>
            <div class="sg-text">${escHtml(item.suggestion)}</div>
            ${item.reason ? `<div class="sg-reason">Why: ${escHtml(item.reason)}</div>` : ''}
            <div class="sg-actions">
              <button class="btn sm" onclick="completeSuggestion('${item._id}')">Mark Completed</button>
            </div>
          </div>
        `).join('')
        : '<div class="sg-empty">Nothing approved right now.</div>';
    } catch {
      container.innerHTML = '<div class="sg-empty">Could not load.</div>';
    }
    loadModList();
  }

  async function refreshApprovedCount() {
    try {
      const res = await fetch(`${BACKEND}/suggestions/approved`, { headers: authHeaders() });
      const list = await res.json();
      if (res.ok && Array.isArray(list)) {
        $('approvedCount').style.display = list.length ? '' : 'none';
        $('approvedCount').textContent = list.length;
      }
    } catch {}
  }

  async function completeSuggestion(id) {
    try {
      const res = await fetch(`${BACKEND}/suggestions/${id}/complete`, {
        method: 'POST',
        headers: authHeaders()
      });
      if (!res.ok) return;
      const card = $(`approved-${id}`);
      if (card) card.remove();
      refreshApprovedCount();
    } catch {}
  }

  // ---------------- ADMIN: promote/demote mods ----------------
  async function loadModList() {
    if (myRole !== 'owner') return;
    const container = $('modList');
    try {
      const res = await fetch(`${BACKEND}/admin/mods`, { headers: authHeaders() });
      const list = await res.json();
      if (!res.ok || !Array.isArray(list)) return;
      container.innerHTML = list.map(u => `
        <div class="mod-list-item">
          <span>${escHtml(u.username)} <span class="role-pill ${u.role}">${u.role}</span></span>
          ${u.role === 'mod' ? `<button class="btn sm secondary" onclick="demoteUser('${escHtml(u.username)}')">Remove Mod</button>` : ''}
        </div>
      `).join('');
    } catch {}
  }

  async function promoteUser() {
    const username = $('promoteUsername').value.trim();
    const msg = $('adminMsg');
    msg.className = 'sg-msg';
    msg.textContent = '';
    if (!username) return;
    try {
      const res = await fetch(`${BACKEND}/admin/promote`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ username })
      });
      const data = await res.json();
      if (!res.ok) { msg.className = 'sg-msg error'; msg.textContent = data.error || 'Failed.'; return; }
      msg.className = 'sg-msg success';
      msg.textContent = `${username} is now a mod.`;
      $('promoteUsername').value = '';
      loadModList();
    } catch {
      msg.className = 'sg-msg error';
      msg.textContent = 'Could not reach the server.';
    }
  }

  async function demoteUser(username) {
    try {
      const res = await fetch(`${BACKEND}/admin/demote`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ username })
      });
      if (res.ok) loadModList();
    } catch {}
  }

  window.addEventListener('storage', e => {
    if (['jmg_token', 'jmg_username'].includes(e.key)) {
      token = localStorage.getItem('jmg_token') || null;
      me    = localStorage.getItem('jmg_username') || null;
      init();
    }
  });

  async function init() {
    token = localStorage.getItem('jmg_token') || null;
    me    = localStorage.getItem('jmg_username') || null;
    await loadRole();
    applyRoleUi();
  }

  init();
</script>
</body>
</html>
